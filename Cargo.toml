[package]
name = "tmdb-api"
description = "Yet another TMDB client. This one is using async methods."
authors = ["Jeremie Drouet <jeremie.drouet@gmail.com>"]
version = "1.0.0-alpha.5"
edition = "2024"
repository = "https://github.com/jdrouet/tmdb-api"
license = "MIT"
readme = "readme.md"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
reqwest-middleware = ["dep:reqwest-middleware"]
# only used for testing
integration = []
ts-rs = ["dep:ts-rs"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = [
    "serde",
    "std",
] }
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "query",
    "rustls",
] }
reqwest-middleware = { version = "0.5", optional = true, features = ["query"] }
serde = { version = "1.0", features = ["derive"] }
serde_repr = { version = "0.1" }
thiserror = { version = "2.0" }
ts-rs = { version = "11.0.1", optional = true, features = ["chrono-impl", "no-serde-warnings"] }

[dev-dependencies]
mockito = { version = "1.4" }
serde_json = { version = "1.0" }
tokio = { version = "1", features = ["full"] }
